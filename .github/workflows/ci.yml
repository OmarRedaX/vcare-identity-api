name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://identity:identity@localhost:5432/vcare_identity_test
      REDIS_URL: redis://localhost:6379/1
      LOG_LEVEL: warn
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: vcare_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Prove every `down` before the integration suites run against the schema.
      - run: npm run migrate
      - run: npx tsx src/migrate.ts rollback --all
      - run: npm run migrate
      - run: npm run test:integration

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No push — the release pipeline is platform-owned (hub deployment.md).
      - run: docker build --tag vcare-identity-api:${{ github.sha }} .
