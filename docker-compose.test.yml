# Test stack. Host ports 5435/6382 avoid the identity dev stack (5432/6379) and care-service
# (5433/6380 dev, 5434/6381 test), so `npm test` / `npm run migrate` can run from the host too.
# Hermetic run: docker compose -f docker-compose.test.yml run --rm test
# Teardown:    docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: vcare_identity_test
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d vcare_identity_test"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  test:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://identity:identity@postgres:5432/vcare_identity_test
      REDIS_URL: redis://redis:6379/1
      LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -e -c "npm ci && npm run lint && npm run typecheck && npm test && npm run test:integration"
